<input id="uk-power-cb" type="checkbox" class="uk-power-input" checked />
<label class="uk-power-switch" for="uk-power-cb">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="uk-power-slider">
    <path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V256c0 17.7 14.3 32 32 32s32-14.3 32-32V32zM143.5 120.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C49.7 115.4 16 181.8 16 256c0 132.5 107.5 240 240 240s240-107.5 240-240c0-74.2-33.8-140.6-86.6-184.6c-13.6-11.3-33.8-9.4-45.1 4.1s-9.4 33.8 4.1 45.1c38.9 32.3 63.5 81 63.5 135.4c0 97.2-78.8 176-176 176s-176-78.8-176-176c0-54.4 24.7-103.1 63.5-135.4z"></path>
  </svg>
</label>

<style>
:root{ --uk-accent-3:#22d3ee; }
.uk-power-input{display:none}
.uk-power-switch{position:relative;width:44px;height:44px;background-color:#374151;border-radius:50%;z-index:1;cursor:pointer;display:flex;align-items:center;justify-content:center;border:2px solid #4b5563;box-shadow:0 0 3px #000 inset}
.uk-power-slider{width:1.1em}
.uk-power-slider path{fill:#6b7280}
.uk-power-input:checked+.uk-power-switch{box-shadow:0 0 1px var(--uk-accent-3) inset,0 0 2px var(--uk-accent-3) inset,0 0 10px var(--uk-accent-3) inset,0 0 30px var(--uk-accent-3),0 0 60px var(--uk-accent-3);border:2px solid #fff;background-color:#164e63}
.uk-power-input:checked+.uk-power-switch .uk-power-slider{filter:drop-shadow(0 0 5px var(--uk-accent-3))}
.uk-power-input:checked+.uk-power-switch .uk-power-slider path{fill:#fff}
</style>
