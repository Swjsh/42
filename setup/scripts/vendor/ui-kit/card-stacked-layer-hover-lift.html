<style>
.uk-lift-card{position:relative;display:flex;align-items:center;justify-content:center;width:320px;border-radius:16px;transition:all .48s cubic-bezier(.23,1,.32,1)}
.uk-lift-content{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:20px 24px;border-radius:14px;color:#e8ecff;overflow:hidden;background:#151c38;transition:all .48s cubic-bezier(.23,1,.32,1);width:100%}
.uk-lift-content::before{position:absolute;content:'';top:-4%;left:50%;width:90%;height:90%;transform:translate(-50%);background:#242b52;z-index:-1;transform-origin:bottom;border-radius:inherit;transition:all .48s cubic-bezier(.23,1,.32,1)}

.uk-lift-para{z-index:1;font-size:.9rem}
.uk-lift-card:hover{transform:translate(0,-10px)}
.uk-lift-card:hover .uk-lift-content::before{rotate:-8deg;top:0;width:100%;height:100%}
.uk-lift-card:hover .uk-lift-content::after{rotate:8deg;top:0;width:100%;height:100%}
