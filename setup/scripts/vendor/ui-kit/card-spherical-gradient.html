<!--
  Spherical Gradient Card
  Source: https://uiverse.io/monkey_8812/curly-moth-56
  License: MIT (Uiverse.io element page footer states "MIT License")
  Ported by: Gamma UI-kit vendor pass 2026-09-03. Classes renamed uk-*, colors remapped
  onto AetherOps custom properties, demo content swapped for a stat figure.
  Cockpit use: alt KPI card with a spinning gradient orb icon tile -- used for the
  4 stat-card icon tiles in the header row.
-->
<div class="uk-orb-card">
  <div class="uk-orb-card-bg"><div class="uk-orb-card-shape"></div></div>
  <div class="uk-orb-card-glass"><div class="uk-orb-card-orb"></div></div>
  <div class="uk-orb-card-frame">
    <div class="uk-orb-card-body">
      <span class="uk-orb-card-num">94%</span>
      <span class="uk-orb-card-label">Approval rate</span>
    </div>
  </div>
</div>

<style>
:root{
  --uk-canvas:#0a0e1c; --uk-panel:#121933; --uk-line:rgba(99,102,241,.22);
  --uk-accent:#6366f1; --uk-accent-2:#8b5cf6; --uk-accent-3:#22d3ee; --uk-glow:rgba(139,92,246,.5);
}
.uk-orb-card{width:200px;height:130px;position:relative;border:1px solid rgba(255,255,255,.15);border-radius:16px;overflow:hidden}
.uk-orb-card-bg{width:100%;height:100%;padding:4px;position:absolute;background:var(--uk-accent-2)}
.uk-orb-card-shape{width:100%;height:100%;border-radius:12px 34px 10px 10px;background:var(--uk-panel)}
.uk-orb-card-glass{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px);border-radius:16px}
.uk-orb-card-orb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--uk-accent),var(--uk-accent-3));animation:uk-orb-spin 12s linear infinite}
@keyframes uk-orb-spin{to{transform:rotate(360deg)}}
.uk-orb-card-frame{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#e5e7ff}
.uk-orb-card-num{font-size:1.6rem;font-weight:600;color:#fff}
.uk-orb-card-label{font-size:.72rem;color:#9ca3d6}
</style>
