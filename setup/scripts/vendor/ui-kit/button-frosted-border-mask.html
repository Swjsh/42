<style>
:root{
  --uk-canvas:#0a0e1c; --uk-panel:#121933; --uk-line:rgba(99,102,241,.22);
  --uk-accent:#6366f1; --uk-accent-2:#8b5cf6; --uk-accent-3:#22d3ee; --uk-glow:rgba(139,92,246,.5);
}
.uk-frost-btn{padding:.7rem 1.4rem;border-radius:.5rem;font-size:.9rem;font-weight:500;color:#e8ecff;text-align:center;position:relative;cursor:pointer;display:inline-block}
.uk-frost-btn::before{content:'';position:absolute;inset:0;border-radius:.5rem;background:linear-gradient(180deg,rgba(99,102,241,0)0%,rgba(99,102,241,.42)100%),rgba(139,92,246,.16);box-shadow:inset 0 0 12px rgba(165,180,252,.35);z-index:-1}
