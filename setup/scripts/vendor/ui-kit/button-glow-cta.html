<!--
  Glow Border CTA Button (PRIMARY CTA)
  Source: https://uiverse.io/gharsh11032000/cuddly-turkey-5
  License: MIT (Uiverse.io element page footer states "MIT License")
  Ported by: Gamma UI-kit vendor pass 2026-09-03. Classes renamed uk-*, colors remapped
  onto AetherOps custom properties. Best match for J's reference header CTA
  (indigo->violet glow, border spins on hover).
  Cockpit use: header "New workflow" gradient CTA button.
-->
<button class="uk-cta-btn">New workflow</button>

<style>
:root{
  --uk-canvas:#0a0e1c; --uk-panel:#121933; --uk-line:rgba(99,102,241,.22);
  --uk-accent:#6366f1; --uk-accent-2:#8b5cf6; --uk-accent-3:#22d3ee; --uk-glow:rgba(139,92,246,.5);
}
.uk-cta-btn{position:relative;height:40px;background-color:var(--uk-canvas);display:flex;align-items:center;justify-content:center;color:#fff;border:none;padding:0 20px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.uk-cta-btn::before{content:'';position:absolute;inset:0;left:-4px;top:-1px;margin:auto;width:calc(100% + 8px);height:calc(100% + 8px);border-radius:10px;background:linear-gradient(-45deg,var(--uk-accent) 0%,var(--uk-accent-3) 100%);z-index:-10;pointer-events:none;transition:all .6s cubic-bezier(.175,.885,.32,1.275)}
.uk-cta-btn::after{content:'';z-index:-1;position:absolute;inset:0;background:linear-gradient(-45deg,var(--uk-accent-2) 0%,var(--uk-accent-3) 100%);transform:translate3d(0,0,0) scale(.95);filter:blur(20px)}
.uk-cta-btn:hover::after{filter:blur(30px)}
.uk-cta-btn:hover::before{transform:rotate(-180deg)}
.uk-cta-btn:active::before{scale:.7}
</style>
