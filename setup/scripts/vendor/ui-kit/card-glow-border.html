  <b class="uk-glow-card-mask"></b>

<style>
:root{
  --uk-canvas:#0a0e1c; --uk-panel:#121933; --uk-line:rgba(99,102,241,.22);
  --uk-accent:#6366f1; --uk-accent-2:#8b5cf6; --uk-accent-3:#22d3ee; --uk-glow:rgba(139,92,246,.5);
}
.uk-glow-card{position:relative;width:190px;height:120px;display:flex;justify-content:center;align-items:center;border-radius:14px;overflow:hidden}
.uk-glow-card::before{content:'';position:absolute;inset:0;background:linear-gradient(315deg,var(--uk-accent),var(--uk-accent-2))}
.uk-glow-card::after{content:'';position:absolute;inset:0;background:linear-gradient(315deg,var(--uk-accent),var(--uk-accent-2));filter:blur(30px)}
.uk-glow-card-mask{position:absolute;inset:6px;background:rgba(10,14,28,0.88);border-radius:10px;z-index:2}
.uk-glow-card-content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center}
.uk-glow-card-title{font-weight:500;letter-spacing:.05em;font-size:.85em;text-transform:uppercase;color:#a5b4fc}
.uk-glow-card-title span{display:block;font-weight:600;font-size:1.6em;color:#fff;letter-spacing:0;text-transform:none;margin-top:4px}
</style>
