<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gamma — Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg-canvas:oklch(14% .020 265); --bg-1:oklch(18% .020 265); --bg-2:oklch(22% .022 265);
  --bg-3:oklch(26% .024 265); --bg-inset:oklch(11% .018 265);
  --bd-subtle:color-mix(in oklch, white 7%, transparent);
  --bd:color-mix(in oklch, white 12%, transparent);
  --bd-strong:color-mix(in oklch, white 20%, transparent);
  --tx-1:oklch(97% .005 265); --tx-2:oklch(78% .010 265);
  --tx-3:oklch(58% .012 265); --tx-4:oklch(40% .010 265);
  --pos:oklch(72% .19 152); --pos-dim:color-mix(in oklch,var(--pos) 16%,transparent);
  --neg:oklch(68% .21 25);  --neg-dim:color-mix(in oklch,var(--neg) 16%,transparent);
  --warn:oklch(78% .17 80); --warn-dim:color-mix(in oklch,var(--warn) 16%,transparent);
  --acc:oklch(70% .16 250); --acc-dim:color-mix(in oklch,var(--acc) 16%,transparent);
  --sh-1:0 1px 2px oklch(0% 0 0/.24);
  --sh-2:0 1px 2px oklch(0% 0 0/.20),0 4px 10px oklch(0% 0 0/.24);
  --sh-3:0 2px 4px oklch(0% 0 0/.20),0 10px 24px oklch(0% 0 0/.32);
  --sh-4:0 4px 8px oklch(0% 0 0/.24),0 20px 48px oklch(0% 0 0/.40);
  --s1:2px;--s2:4px;--s3:8px;--s4:12px;--s5:16px;--s6:20px;--s7:24px;--s8:32px;--s9:40px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-pill:999px;
  --e-hover:cubic-bezier(.16,1,.3,1); --e-open:cubic-bezier(.32,.72,0,1);
  --e-close:cubic-bezier(.4,0,1,1); --e-route:cubic-bezier(.65,0,.35,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --side:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg-canvas);color:var(--tx-1);font-family:var(--font);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.num,td.n,.big,.mid,.stat{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* ambient wash + subliminal grain (kills gradient banding) */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 520px at 10% -10%,color-mix(in oklch,var(--acc) 12%,transparent),transparent 62%),
             radial-gradient(720px 440px at 94% 2%,color-mix(in oklch,var(--pos) 7%,transparent),transparent 64%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.035;
  mix-blend-mode:overlay;background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>')}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd-strong);border-radius:6px;border:3px solid var(--bg-canvas)}
::selection{background:var(--acc-dim)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r-sm)}

/* ---------------- shell ---------------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;position:relative;z-index:1}
.side{border-right:1px solid var(--bd-subtle);background:var(--bg-inset);padding:var(--s6) var(--s4);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:var(--s1)}
.brand{display:flex;align-items:center;gap:var(--s4);padding:var(--s1) var(--s3) var(--s6)}
.mark{width:32px;height:32px;border-radius:9px;flex:none;position:relative;
  background:linear-gradient(145deg,var(--acc),oklch(64% .19 300));
  box-shadow:inset 0 1px 0 color-mix(in oklch,white 22%,transparent),0 6px 18px -6px var(--acc)}
.mark::after{content:"Γ";position:absolute;inset:0;display:grid;place-items:center;font:700 17px/1 var(--font);color:#fff}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.015em}
.brand small{display:block;color:var(--tx-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-md);color:var(--tx-2);
  font-size:14px;font-weight:500;position:relative;transition:background .14s var(--e-hover),color .14s var(--e-hover)}
.nav a:hover{background:var(--bg-1);color:var(--tx-1);text-decoration:none}
.nav a.on{background:var(--bg-2);color:var(--tx-1)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;
  background:var(--acc);box-shadow:0 0 12px var(--acc)}
.nav .ic{width:17px;text-align:center;font-size:13px;opacity:.9}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:var(--r-pill);
  background:var(--bg-3);color:var(--tx-2);border:1px solid var(--bd)}
.nav .badge.hot{background:var(--warn-dim);color:var(--warn);border-color:color-mix(in oklch,var(--warn) 34%,transparent)}
.side .foot{margin-top:auto;font-size:11px;color:var(--tx-4);line-height:1.8;padding:var(--s4) var(--s3) 0;
  border-top:1px solid var(--bd-subtle)}
kbd{background:var(--bg-3);border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 5px;
  font:600 11px/1.4 var(--mono);color:var(--tx-2)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s4);padding:var(--s5) var(--s7);
  border-bottom:1px solid var(--bd-subtle);
  background:color-mix(in oklch,var(--bg-canvas) 78%,transparent);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.top h1{font-size:24px;font-weight:600;letter-spacing:-.015em}
.sp{flex:1}
.clock{font:400 11px/1.4 var(--mono);color:var(--tx-3);letter-spacing:.02em;text-align:right}
.view{padding:var(--s7);max-width:1560px;width:100%}
.view.anim{animation:vin .3s var(--e-route)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------------- primitives ---------------- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}
.big{font-size:40px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.mid{font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.stat{font-size:18px;font-weight:600;letter-spacing:-.01em}
.mut{color:var(--tx-2);font-size:14px}
.dim{color:var(--tx-3);font-size:12px}
.micro{color:var(--tx-4);font-size:11px;letter-spacing:.02em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warnc{color:var(--warn)}.acc{color:var(--acc)}
.mono{font-family:var(--mono)}
.grid{display:grid;gap:var(--s5)}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.stack{display:flex;flex-direction:column;gap:var(--s5)}
.row{display:flex;align-items:center;gap:var(--s4)}
.wrap{flex-wrap:wrap}
section+section{margin-top:var(--s8)}
.shead{display:flex;align-items:baseline;gap:var(--s4);margin-bottom:var(--s5)}
.shead h2{font-size:18px;font-weight:600;letter-spacing:-.01em}

.card{background:var(--bg-1);border:1px solid var(--bd-subtle);border-radius:var(--r-lg);
  padding:var(--s6);box-shadow:var(--sh-2);position:relative;container-type:inline-size;
  transition:box-shadow .16s var(--e-hover),border-color .16s var(--e-hover),transform .16s var(--e-hover)}
.card h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);
  margin-bottom:var(--s4)}
.card.click{cursor:pointer}
.card.click:hover{box-shadow:var(--sh-3);border-color:var(--bd);transform:translateY(-2px)}
/* mouse-following spotlight - the signature premium hover */
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),var(--acc-dim),transparent 70%);
  transition:opacity .2s var(--e-hover)}
.spot:hover::before{opacity:1}
/* gradient hairline for the hero only - restraint is the point */
.gborder{position:relative}
.gborder::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--acc) 0%,transparent 55%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.7}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);
  font-size:11px;font-weight:600;letter-spacing:.03em;border:1px solid var(--bd);background:var(--bg-2);
  color:var(--tx-2);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
/* traffic-light DOTS for health. never red/green fills - that vocabulary is P&L's */
.chip.ok .dot{background:var(--pos)} .chip.warn .dot{background:var(--warn)} .chip.bad .dot{background:var(--neg)}
.chip.ok{color:var(--tx-1)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--neg)}
.chip.live .dot{animation:pl 2.4s var(--e-hover) infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}

.bar{height:6px;border-radius:var(--r-pill);background:var(--bg-inset);overflow:hidden;border:1px solid var(--bd-subtle)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),oklch(78% .14 250));
  transition:width .8s var(--e-open)}
.bar.done>i{background:linear-gradient(90deg,var(--pos),oklch(82% .15 152))}
.src{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--bd-subtle);font-size:11px;
  color:var(--tx-4);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5)}
.src .stale{color:var(--warn)}
  .age{font-variant-numeric:tabular-nums}
  .age.stale{color:var(--warn)}
.stagger>*{opacity:0;transform:translateY(8px);animation:fu .4s var(--e-hover) forwards;
  animation-delay:calc(var(--i,0)*45ms)}
@keyframes fu{to{opacity:1;transform:none}}

/* ---------------- calendar ---------------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:11px;color:var(--tx-4);text-align:center;letter-spacing:.06em;text-transform:uppercase;
  font-weight:600;padding-bottom:var(--s2)}
.cell{min-height:70px;border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--bg-1);
  padding:6px 8px;display:flex;flex-direction:column;gap:2px;
  transition:transform .14s var(--e-hover),border-color .14s var(--e-hover),box-shadow .14s var(--e-hover)}
.cell.empty{background:transparent;border-color:transparent}
.cell.has{cursor:pointer}
.cell.has:hover{transform:translateY(-2px);border-color:var(--bd-strong);box-shadow:var(--sh-2)}
.cell .d{font-size:11px;color:var(--tx-4);font-weight:600;line-height:1}
.cell .v{font-weight:650;font-size:clamp(11px,1.05vw,14px);line-height:1.15;margin-top:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cell .t{font-size:10px;color:var(--tx-4)}
.cell .arms{display:flex;gap:2px;margin-top:1px}
.cell .arms i{width:5px;height:5px;border-radius:1px;background:var(--tx-4);opacity:.7}
.legend{display:flex;align-items:center;gap:var(--s3);font-size:11px;color:var(--tx-4)}
.legend .ramp{width:110px;height:8px;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--neg),var(--bg-2),var(--pos));border:1px solid var(--bd-subtle)}

/* ---------------- table ---------------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-4);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg-1);z-index:1}
td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--bd-subtle);color:var(--tx-2)}
td.n{text-align:right;font-family:var(--mono);font-size:12px}
tbody tr{transition:background .12s var(--e-hover)}
tbody tr:hover{background:var(--bg-2)}
tr:last-child td{border-bottom:none}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;background:oklch(8% .01 265/.66);backdrop-filter:blur(3px);opacity:0;
  pointer-events:none;transition:opacity .22s var(--e-open);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,95vw);z-index:50;background:var(--bg-1);
  border-left:1px solid var(--bd);transform:translateX(101%);transition:transform .26s var(--e-open);
  display:flex;flex-direction:column;box-shadow:var(--sh-4)}
.drawer.closing{transition-duration:.18s;transition-timing-function:var(--e-close)}
.drawer.on{transform:none}
.drawer header{padding:var(--s6) var(--s7);border-bottom:1px solid var(--bd-subtle);display:flex;
  align-items:center;gap:var(--s4)}
.drawer header h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.drawer .body{padding:var(--s6) var(--s7);overflow:auto;flex:1}
.x{margin-left:auto;background:var(--bg-2);border:1px solid var(--bd);color:var(--tx-2);width:30px;height:30px;
  border-radius:var(--r-md);cursor:pointer;font-size:16px;line-height:1;transition:background .14s var(--e-hover)}
.x:hover{background:var(--bg-3);color:var(--tx-1)}

/* ---------------- palette ---------------- */
.pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:13vh;
  background:oklch(8% .01 265/.6);backdrop-filter:blur(4px)}
.pal.on{display:flex}
.pal .box{width:min(580px,92vw);background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-4);animation:pop .2s var(--e-hover)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.pal input{width:100%;padding:16px 18px;background:transparent;border:none;outline:none;color:var(--tx-1);
  font-size:15px;font-family:var(--font);border-bottom:1px solid var(--bd-subtle)}
.pal .res{max-height:340px;overflow:auto;padding:var(--s2)}
.pal .res div{padding:10px 14px;cursor:pointer;display:flex;gap:11px;align-items:center;font-size:14px;
  border-radius:var(--r-md)}
.pal .res div.sel{background:var(--bg-3)}
.pal .res .k{margin-left:auto;color:var(--tx-4);font-size:11px}

.brief{padding:var(--s7) var(--s8)}
.brieflines p{font-size:16px;line-height:1.65;color:var(--tx-1);margin-top:var(--s4);max-width:78ch}
.brieflines p:first-child{font-size:19px;letter-spacing:-.01em}
.flag{margin-top:var(--s5);padding:var(--s4) var(--s5);border-radius:var(--r-md);font-size:13.5px;
  border:1px solid var(--bd);background:var(--bg-2)}
.flag b{letter-spacing:.06em;font-size:11px;margin-right:var(--s3);color:var(--acc)}
.flag.bad{border-color:color-mix(in oklch,var(--warn) 34%,transparent);background:var(--warn-dim)}
.flag.bad b{color:var(--warn)}
.note{padding:var(--s9);text-align:center;color:var(--tx-4);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:var(--s5);padding:var(--s3) 0;
  border-bottom:1px solid var(--bd-subtle);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx-3);white-space:nowrap}
.kv .v{text-align:right;color:var(--tx-1)}

@container (max-width:250px){.card .spark{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:var(--s3)}
  .side .foot{display:none}.nav{flex-direction:row;flex-wrap:wrap}.nav a.on::before{display:none}
  .view{padding:var(--s5)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .stagger>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark"></div><div><b>Gamma</b><small>Cockpit</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><kbd>⌘</kbd><kbd>K</kbd> palette · <kbd>?</kbd> help<br><span id="footstamp"></span></div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="vtitle">Overview</h1>
      <span class="chip live" id="statechip"><i class="dot"></i><span id="statetxt"></span></span>
      <div class="sp"></div>
      <div class="clock" id="clock"></div>
    </header>
    <div class="view anim" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h2 id="dtitle"></h2><button class="x" id="dclose" aria-label="Close">×</button></header>
  <div class="body" id="dbody"></div>
</aside>
<div class="pal" id="pal">
  <div class="box"><input id="palin" placeholder="Jump to a view, desk, agent or day…" autocomplete="off">
  <div class="res" id="palres"></div></div>

function stag(host,cap=8){[...host.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,cap)));host.classList.add('stagger')}
function countUp(node,to,fmt){
  if(RM||to==null||isNaN(to)){node.textContent=fmt(to);return}
  const t0=performance.now(),dur=600,ease=t=>1-Math.pow(1-t,3);
  (function tick(now){const t=Math.min((now-t0)/dur,1);
    node.textContent=fmt(to*ease(t)); if(t<1)requestAnimationFrame(tick); else node.textContent=fmt(to)})(t0);
}
function spot(card){

/* cumulative daily series for a desk's sparkline */
function series(arm){
  const v=(D.calendar?.views||{})[arm]; if(!v)return[];
  return Object.keys(v.days).sort().reduce((a,k)=>{a.push((a.length?a[a.length-1]:0)+(v.days[k].n||0));return a},[]);
}
function spark(vals,w=132,h=34){
  if(!vals||vals.length<2)return el('div','micro','no series');
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-2-((v-mn)/rg)*(h-4)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const up=vals[vals.length-1]>=0, col=up?'var(--pos)':'var(--neg)';
  const ns='http://www.w3.org/2000/svg', s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox',`0 0 ${w} ${h}`); s.setAttribute('width',w); s.setAttribute('height',h);
  s.setAttribute('class','spark'); s.style.overflow='visible';
  const area=document.createElementNS(ns,'path');
  area.setAttribute('d',`${d} L ${w} ${h} L 0 ${h} Z`);
  area.setAttribute('fill',up?'var(--pos-dim)':'var(--neg-dim)');
  const ln=document.createElementNS(ns,'path');
  ln.setAttribute('d',d);ln.setAttribute('fill','none');ln.setAttribute('stroke',col);
  ln.setAttribute('stroke-width','1.6');ln.setAttribute('stroke-linejoin','round');ln.setAttribute('stroke-linecap','round');
  s.append(area,ln); return s;
}

  tbl.innerHTML='<thead><tr><th>When</th><th>Tier</th><th>Agent</th><th>Did</th><th>Artifacts</th></tr></thead>';
  const tb=el('tbody');
  (a.events||[]).forEach(e=>{
    const vd=e.verdict||'';
    const cl=vd==='FABRICATED'?'neg':vd==='VERIFIED'?'pos':'dim';
    const tr=el('tr');
    tr.innerHTML='<td class="mono dim">'+esc(String(e.ts||'').slice(5,16).replace('T',' '))+'</td>'+
      '<td><span class="chip">'+esc(e.tier)+'</span></td>'+
      '<td><b>'+esc(e.who)+'</b>'+(e.lane?'<div class="micro">'+esc(e.lane)+'</div>':'')+'</td>'+
      '<td>'+(e.ok?'':'<span class="neg">\u2715 </span>')+esc(e.what)+
        (e.err?'<div class="micro warnc">'+esc(e.err)+'</div>':'')+'</td>'+
      '<td class="'+cl+'">'+esc(vd||'\u2014')+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); c.appendChild(tbl);
  c.appendChild(srcRow(a.sources));
  h.appendChild(c);
}

/* ---------- JOURNAL ---------- */
let calArm='BOOK', calBasis='n', calMonth=null;
function vJournal(h){
  h.appendChild(el('div','shead','<h2>Journal</h2><span class="dim">per-arm P&amp;L · click a day for its trades</span>'));
  const c=el('div','card'); calendarInto(c,calArm,false); h.appendChild(c);
}
function calendarInto(host,arm,mini){
  host.innerHTML='';
  const views=D.calendar?.views||{}, v=views[arm]||{days:{},summary:{}};
  const ctl=el('div','row wrap'); ctl.style.marginBottom='var(--s5)';
  if(!mini){
    const sel=el('select'); sel.style.cssText='background:var(--bg-2);color:var(--tx-1);border:1px solid var(--bd);border-radius:var(--r-md);padding:6px 10px;font-family:var(--font);font-size:13px';
    Object.keys(views).sort((a,b)=>a==='BOOK'?-1:b==='BOOK'?1:a.localeCompare(b))
      .forEach(k=>{const o=el('option',null,k);o.value=k;if(k===arm)o.selected=true;sel.appendChild(o)});
    sel.onchange=()=>{calArm=sel.value;calendarInto(host,calArm,mini)};
    const bs=el('select'); bs.style.cssText=sel.style.cssText;
    [['n','net of fees'],['g','gross']].forEach(([k,l])=>{const o=el('option',null,l);o.value=k;if(k===calBasis)o.selected=true;bs.appendChild(o)});
    bs.onchange=()=>{calBasis=bs.value;calendarInto(host,arm,mini)};
    ctl.append(sel,bs);
  }
  const dates=Object.keys(v.days).sort();
  const last=calMonth||(dates.length?dates[dates.length-1]:(D.today||''));
  const [Y,Mo]=last.split('-').map(Number);
  const months=[...new Set(dates.map(d=>d.slice(0,7)))].sort();
  const idx=months.indexOf(`${Y}-${String(Mo).padStart(2,'0')}`);
  const nav=el('div','row'); nav.style.marginLeft='auto';
  const mkb=(t,dis,fn)=>{const b=el('button',null,t);
    b.style.cssText='background:var(--bg-2);border:1px solid var(--bd);color:var(--tx-2);border-radius:var(--r-md);padding:5px 11px;cursor:pointer;font-size:13px';
    b.disabled=dis; if(dis)b.style.opacity=.35; else b.onclick=fn; return b};
  nav.appendChild(mkb('‹',idx<=0,()=>{calMonth=months[idx-1]+'-01';calendarInto(host,arm,mini)}));
  nav.appendChild(el('span','mut',`${Y}-${String(Mo).padStart(2,'0')}`));
  nav.appendChild(mkb('›',idx<0||idx>=months.length-1,()=>{calMonth=months[idx+1]+'-01';calendarInto(host,arm,mini)}));
  ctl.appendChild(nav); host.appendChild(ctl);

  const clamp=(D.calendar_scale?.clamp)||500;
  const dow=el('div','cal');
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>dow.appendChild(el('div','dow',d)));
  host.appendChild(dow);
  const grid=el('div','cal'); grid.style.marginTop='6px';
  const first=new Date(Y,Mo-1,1), nd=new Date(Y,Mo,0).getDate();
  for(let i=0;i<first.getDay();i++)grid.appendChild(el('div','cell empty'));
  let tot=0,n=0;
  for(let d=1;d<=nd;d++){
    const iso=`${Y}-${String(Mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`, row=v.days[iso];
    const p=row?row[calBasis]:null;
    const c=el('div','cell'+(row?' has ':' ')+(row?(p>0?'win':p<0?'loss':'flat'):''));
    c.appendChild(el('div','d',String(d)));
    if(row){
      tot+=p;n++;
      // clamped intensity: one blowout day cannot flatten the month
      const k=Math.min(1,Math.abs(p)/clamp);
      c.style.background=`color-mix(in oklch, var(--${p>0?'pos':'neg'}) ${(6+k*22).toFixed(0)}%, var(--bg-1))`;
      c.appendChild(el('div','v',M(p)));
      c.appendChild(el('div','t',row.t+(row.t===1?' trade':' trades')));
      c.title=`${iso} · ${row.t} trades · ${M2(p)}`;
      c.onclick=()=>dayDrawer(iso,arm);
    }
    grid.appendChild(c);
  }
  host.appendChild(grid);
  const s=v.summary||{};
  const foot=el('div','row wrap'); foot.style.marginTop='var(--s5)';
  foot.appendChild(el('div','mut',`<b class="${sgn(tot)}">${M(tot)}</b> this month · ${n} trading days`));
  foot.appendChild(el('div','dim',`all-time <b class="${sgn(calBasis==='n'?s.total_pnl_net:s.total_pnl_gross)}">${M(calBasis==='n'?s.total_pnl_net:s.total_pnl_gross)}</b> over ${s.trading_days??'—'} days`));
  const lg=el('div','legend'); lg.style.marginLeft='auto';
  lg.innerHTML=`<span>${M(-clamp)}</span><span class="ramp"></span><span>${M(clamp)}</span>
    <span class="micro">scale clamped · true extremes ${M(-(D.calendar_scale?.max_abs||0))} / ${M(D.calendar_scale?.max_abs||0)}</span>`;
  foot.appendChild(lg); host.appendChild(foot);
  host.appendChild(srcRow([D.calendar_source]));
}
function dayDrawer(iso,arm){
  const v=(D.calendar_full?.views||{})[arm]||{days:{}}, row=(v.days||{})[iso];
  openDrawer(iso+' · '+arm,b=>{
    if(!row){b.appendChild(el('div','note','No trades recorded for this day.'));return}
    const k=el('div');
    [['Net of fees',M2(row.pnl_net)],['Gross',M2(row.pnl_gross)],['Fees',M2(row.fees_total)],
     ['Trades',row.trade_count],['Wins / losses',`${row.wins_gross} / ${row.losses_gross}`]]
      .forEach(([a,x])=>k.appendChild(el('div','kv',`<span class="k">${esc(a)}</span><span class="v mono">${esc(x)}</span>`)));
    b.appendChild(k);
    const tr=row.trades||[];
    if(!tr.length){b.appendChild(el('div','note','Day totals only — no per-trade rows.'));return}
    const t=el('table'); t.style.marginTop='var(--s6)';
    t.innerHTML='<thead><tr><th>Time</th><th>Arm</th><th>Contract</th><th>Setup</th><th class="n">Qty</th><th class="n">In</th><th class="n">Out</th><th class="n">Net</th></tr></thead>';
    const tb=el('tbody');
    tr.forEach(x=>{
      const net=x.pnl_net_ex_cat!=null?x.pnl_net_ex_cat:x.pnl_gross;
      tb.appendChild(el('tr',null,
        `<td class="mono dim">${esc(String(x.entry_ts_et||'').slice(11,16))}</td>
         <td>${esc(x.arm||'')}</td>
         <td class="mono">${esc(String(x.strike||'')+(x.side||''))}</td>
         <td class="dim">${esc(x.setup||'—')}</td>
         <td class="n">${esc(x.qty??'')}</td>
         <td class="n">${x.entry_premium!=null?x.entry_premium.toFixed(2):'—'}</td>
         <td class="n">${x.exit_premium!=null?x.exit_premium.toFixed(2):(x.exit_premium_avg!=null?x.exit_premium_avg.toFixed(2):'—')}</td>
         <td class="n ${sgn(net)}">${M2(net)}</td>`));
    });
    t.appendChild(tb); b.appendChild(t);
  });
}

/* ---------- ANSWERS ---------- */
function vAnswers(h){
  h.appendChild(el('div','shead','<h2>The answers</h2><span class="dim">you shouldn’t have to ask</span>'));
  const g=el('div','grid g2');
  (D.answers||[]).forEach(a=>{
    const c=el('div','card click'); spot(c);
    c.appendChild(el('div','micro',esc(a.q)));
    const r=el('div','row'); r.style.margin='var(--s3) 0';
    r.appendChild(el('span','chip '+health(a.verdict),`<i class="dot"></i>${esc(a.verdict)}`));
    r.appendChild(el('span','mut',esc(a.answer)));
    c.appendChild(r);
    if(a.detail)c.appendChild(el('div','dim',esc(a.detail)));
    if(a.means){const m=el('div','mut',esc(a.means));
      m.style.cssText='border-left:2px solid var(--acc);padding-left:var(--s4);margin-top:var(--s4);color:var(--tx-2)';
      c.appendChild(m)}
    c.appendChild(srcRow(a.sources));
    c.onclick=()=>answerDrawer(a);
    g.appendChild(c);
  });
  h.appendChild(g); stag(g);
}
function answerDrawer(a){
  openDrawer(a.q,b=>{
    b.appendChild(el('div','row',`<span class="chip ${health(a.verdict)}"><i class="dot"></i>${esc(a.verdict)}</span>`));
    b.appendChild(el('div','mid',esc(a.answer)));
    if(a.detail)b.appendChild(el('div','mut',esc(a.detail)));
    if(a.means)b.appendChild(el('div','dim',esc(a.means)));
    b.appendChild(srcRow(a.sources));
  });
}

/* ---------- ACTIVITY ---------- */
function vActivity(h){
  const hq=D.hq||{};
  h.appendChild(el('div','shead','<h2>Activity</h2><span class="dim">clocks · wants · recent ships</span>'));
  const g=el('div','grid g2');

  const cc=el('div','card'); cc.appendChild(el('h3',null,'Shadow clocks'));
  (hq.clocks||[]).forEach(c=>{
    const d=el('div'); d.style.marginBottom='var(--s5)';
    const done=(c.have||0)>=(c.need||1);
    d.appendChild(el('div','row',`<span style="font-weight:600">${esc(c.label)}</span>
      <span class="sp"></span><span class="mono dim">${c.have} / ${c.need}</span>`));
    const b=el('div','bar'+(done?' done':'')); const i=el('i');
    i.style.width=Math.min(100,100*(c.have||0)/Math.max(1,c.need||1))+'%'; b.appendChild(i); d.appendChild(b);
    if(c.explain)d.appendChild(el('div','micro',esc(c.explain)));
    cc.appendChild(d);
  });
  if(!(hq.clocks||[]).length)cc.appendChild(el('div','note','no clock data'));
  g.appendChild(cc);

  const wc=el('div','card'); wc.appendChild(el('h3',null,'What I want from you'));
  (D.wants_full||[]).forEach((w,i)=>{
    const d=el('div'); d.style.cssText='display:flex;gap:var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--bd-subtle)';
    d.appendChild(el('div','acc',String(i+1)));
    const tx=el('div','mut',esc(w.text));
    if(w.stale)tx.appendChild(el('span','warnc',' ⚠ unverified'+(w.verified_at?' since '+esc(w.verified_at):'')));
    d.appendChild(tx); wc.appendChild(d);
  });
  if(!(D.wants_full||[]).length)wc.appendChild(el('div','note','nothing outstanding'));
  g.appendChild(wc);
  h.appendChild(g);

  const sc=el('div','card'); sc.style.marginTop='var(--s5)';
  sc.appendChild(el('h3',null,'Recent ships'));
  (hq.recent_ships||[]).forEach(t=>sc.appendChild(el('div','kv',`<span class="k">${esc(t)}</span>`)));
  if(!(hq.recent_ships||[]).length)sc.appendChild(el('div','note','no recent ships'));
  h.appendChild(sc);
}

/* ============================ drawer ============================ */
function openDrawer(title,build){
  $('#dtitle').textContent=title; const b=$('#dbody'); b.innerHTML=''; build(b);
  const d=$('#drawer'); d.classList.remove('closing'); d.classList.add('on'); d.setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on');
}
function closeDrawer(){
  const d=$('#drawer'); d.classList.add('closing'); d.classList.remove('on'); d.setAttribute('aria-hidden','true');
  $('#scrim').classList.remove('on');
}

/* ============================ nav + palette ============================ */
function navBuild(){
  const n=$('#nav'); n.innerHTML='';
  VIEWS.forEach(v=>{
    const a=el('a',null,`<span class="ic">${v.ic}</span><span>${v.label}</span>`);
    a.href='#'+v.id; a.dataset.v=v.id;
    // Route on click as well as on hashchange. Some hosts (the in-app preview
    // serves the file as a data: URL) do not fire hashchange, which would leave
    // the nav visibly dead. Clicking must always work.
    // Route EXPLICITLY, then sync the hash for deep-linking. Routing must not
    // depend on the hash actually changing: some hosts serve this file from a
    // data: URL where hash assignment is a no-op, which left the nav dead.
    a.onclick=e=>{e.preventDefault();route(v.id);try{history.replaceState(null,'','#'+v.id)}catch(_){}};
    if(v.id==='desks')a.appendChild(el('span','badge',String((D.desks?.desks||[]).length)));
    if(v.id==='answers'){
      const bad=(D.answers||[]).filter(x=>['RED','YELLOW','NO DATA','DEGRADED'].includes(String(x.verdict).toUpperCase())).length;
      if(bad)a.appendChild(el('span','badge hot',String(bad)));
    }
    n.appendChild(a);
  });
}
const RENDER={overview:vOverview,desks:vDesks,orchestration:vOrch,engine:vEngine,agents:vAgents,journal:vJournal,answers:vAnswers,activity:vActivity};
let CUR='overview';
function route(want){
  const id=want||(location.hash||'#overview').slice(1).split('?')[0];
  const v=VIEWS.find(x=>x.id===id)||VIEWS[0];
  CUR=v.id;
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v.id));
  $('#vtitle').textContent=v.label;
  const host=$('#view'); host.innerHTML=''; RENDER[v.id](host);
  host.classList.remove('anim'); void host.offsetWidth; host.classList.add('anim');
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}

const PAL=[];
function palBuild(){
  PAL.length=0;
  VIEWS.forEach(v=>PAL.push({t:v.label,s:'View',go:()=>route(v.id)}));
  (D.desks?.desks||[]).forEach(d=>PAL.push({t:d.name,s:'Desk',go:()=>deskDrawer(d)}));
  (D.org?.functions||[]).forEach(f=>PAL.push({t:f.name,s:'Agent',go:()=>route('orchestration')}));
  (D.answers||[]).forEach(a=>PAL.push({t:a.q,s:'Answer',go:()=>answerDrawer(a)}));
  (D.engine_room?.engines||[]).forEach(e=>PAL.push({t:e.name,s:'Engine',go:()=>engineDrawer(e)}));
  const v=(D.calendar?.views||{}).BOOK||{days:{}};
  Object.keys(v.days).sort().reverse().slice(0,40).forEach(d=>PAL.push({t:d,s:'Day',go:()=>dayDrawer(d,'BOOK')}));
}
let palSel=0;
function palRender(q){
  const res=$('#palres'); res.innerHTML='';
  const hits=PAL.filter(p=>(p.t+' '+p.s).toLowerCase().includes(q.toLowerCase())).slice(0,9);
  palSel=Math.min(palSel,Math.max(0,hits.length-1));
  hits.forEach((p,i)=>{
    const d=el('div',i===palSel?'sel':'',`<span>${esc(p.t)}</span><span class="k">${esc(p.s)}</span>`);
    d.onclick=()=>{palClose();p.go()}; res.appendChild(d);
  });
  return hits;
}
function palOpen(){$('#pal').classList.add('on');$('#palin').value='';palSel=0;palRender('');$('#palin').focus()}
function palClose(){$('#pal').classList.remove('on')}

/* ============================ boot ============================ */
(function boot(){
  const hq=D.hq||{};
  $('#statetxt').textContent=hq.state_word||'NO DATA';
  $('#statechip').className='chip live '+(hq.state_word?'ok':'bad');
  $('#clock').innerHTML=esc(hq.now_et_label||D.generated_et||'')+'<br><span style="opacity:.6">'+esc(hq.tape_headline||'')+'</span>';
  const fs=$('#footstamp'); fs.textContent='built '; fs.appendChild(ageEl(D.built_at_et,2));
  navBuild(); palBuild();
  $('#dclose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
  $('#palin').addEventListener('input',e=>{palSel=0;palRender(e.target.value)});
  $('#palin').addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){palSel++;palRender($('#palin').value);e.preventDefault()}
    else if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);palRender($('#palin').value);e.preventDefault()}
    else if(e.key==='Enter'){const h=palRender($('#palin').value);if(h[palSel]){palClose();h[palSel].go()}}
  });
  $('#pal').addEventListener('click',e=>{if(e.target.id==='pal')palClose()});
  let gPending=false;
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();return}
    if(e.key==='Escape'){palClose();closeDrawer();return}
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.key==='g'){gPending=true;setTimeout(()=>gPending=false,900);return}
    if(gPending){const v=VIEWS.find(x=>x.key===e.key);if(v){route(v.id);try{history.replaceState(null,'','#'+v.id)}catch(_){}};gPending=false;return}
    if(e.key==='?'){openDrawer('Keyboard',b=>{
      b.innerHTML='<div class="kv"><span class="k">⌘K / Ctrl+K</span><span class="v">command palette</span></div>'+
        VIEWS.map(v=>`<div class="kv"><span class="k">g then ${v.key}</span><span class="v">${v.label}</span></div>`).join('')+
        '<div class="kv"><span class="k">Esc</span><span class="v">close</span></div>';})}
  });
  addEventListener('hashchange',()=>route()); route();
})();
</script>
