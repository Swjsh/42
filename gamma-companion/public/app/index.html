<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gamma</title>
<meta name="description" content="Gamma — autonomous 0DTE options research.">
<!-- No CDN, no web font, no framework: repo doctrine, and it survives being opened
     with the network down. Everything below is served from this box. -->
<link rel="stylesheet" href="./css/app.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0a0a0b">
</head>
<body>

<!-- one aurora, one grain, one vignette. Fixed and inert. -->
<div class="amb" aria-hidden="true">
  <div class="amb__glow"></div>
  <div class="amb__grain"></div>
  <div class="amb__vign"></div>
</div>

<!-- The top bar carries identity and state only. J: "I dont want a million nav
     panels" — so routing lives on the hero panels, not up here. -->
<header class="top" id="top" hidden>
  <div class="top__in">
    <a class="brand" href="#/" aria-label="Gamma home">
      <span class="brand__mark" aria-hidden="true"></span>
      <span>
        <span class="brand__name">GAMMA</span>
        <span class="brand__sub">0DTE research</span>
      </span>
    </a>
    <span class="top__spacer"></span>
    <button class="kbtn" type="button" id="kbtn" aria-label="Open the command palette"><kbd>Ctrl</kbd><kbd>K</kbd></button>
    <span class="top__clock mono" id="clock"></span>
    <span class="pill" id="engine"><i class="pill__dot"></i><span>checking</span></span>
  </div>
</header>

<main id="view" role="main"></main>

<script src="./js/art.js"></script>
<script src="./js/md.js"></script>
<script src="./js/humanize.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/data.js"></script>
<script src="./js/views.js"></script>
<script src="./js/chat.js"></script>
<script src="./js/desk.js"></script>
<script src="./js/palette.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
